name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p .

      - name: Build
        run: npx vite build

      # The repo currently has a large pre-existing gap between its source
      # formatting and the configured prettier rules (unrelated to
      # correctness), so lint is informational only for now rather than a
      # hard gate. Tighten this once the codebase is reformatted.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

  # Deploys ranksarthi.com (droplet ranksarthi-hub) once the build is green.
  # The DEPLOY_SSH_KEY secret is restricted on the droplet to running
  # /var/www/ranksarthi-hub/deploy.sh (git pull, npm ci, build, restart).
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy to droplet
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "143.110.246.194 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOZaCJflSd1jb9UNHktp9xsg1zDc3DK15Nv9HEAbDKNO" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key root@143.110.246.194

      - name: Smoke test
        run: |
          for p in / /contact /jee/syllabus; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://ranksarthi.com$p")
            echo "$code $p"
            [ "$code" = 200 ] || exit 1
          done
